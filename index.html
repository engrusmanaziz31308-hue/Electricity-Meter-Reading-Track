<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بجلی میٹر ٹریکر / Electricity Meter Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161C">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#12161C;
    --surface:#1B212B;
    --surface-2:#232A35;
    --accent:#FFB020;
    --accent-2:#38BDF8;
    --text:#EDEFF2;
    --text-muted:#8B95A3;
    --good:#34D399;
    --warn:#F87171;
    --border:#2C3441;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1a2029 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Noto Naskh Urdu','Segoe UI',Tahoma,sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  html[lang="en"] body{ font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
  h1,h2,h3{ font-weight:700; margin:0; }
  html[lang="ur"] h1, html[lang="ur"] h2{ font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif; }
  .digits{
    font-family:'Courier New',monospace;
    font-variant-numeric:normal;
    font-feature-settings:'zero' 0;
    letter-spacing:1px;
    direction:ltr;
    unicode-bidi:isolate;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(18,22,28,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:10px 16px 12px;
    text-align:center;
  }
  .header-top{
    display:flex; justify-content:flex-end;
    max-width:680px; margin:0 auto 6px;
  }
  .lang-switch{
    display:flex; gap:4px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:3px;
  }
  .lang-switch button{
    border:none; border-radius:16px; padding:5px 12px; font-size:.75rem;
    background:transparent; color:var(--text-muted);
  }
  .lang-switch button.active{ background:var(--accent); color:#1a1200; font-weight:700; }
  header h1{font-size:1.4rem;color:var(--accent);}
  header h1 span{color:var(--text);}
  header p{margin:4px 0 0;color:var(--text-muted);font-size:.82rem;}

  .wrap{max-width:680px;margin:0 auto;padding:16px;position:relative;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  button{
    font-family:inherit;font-size:.88rem;cursor:pointer;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 14px;border-radius:10px;
    transition:transform .12s ease, border-color .12s ease;
  }
  button:active{transform:scale(.96);}
  .btn-primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700;}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--warn);border-color:var(--warn);background:transparent;}
  .btn-sm{padding:6px 10px;font-size:.78rem;}
  .toolbar button{flex:1;min-width:140px;}

  .meter-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .meter-card::before{
    content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;
    background:linear-gradient(var(--accent),var(--accent-2));
  }
  .meter-card.alert::before{ background:var(--warn); }
  .meter-head{display:flex;align-items:center;gap:12px;justify-content:space-between;}
  .meter-title{display:flex;align-items:center;gap:10px;}
  .dial{width:56px;height:56px;flex:none;}
  .meter-name{font-size:1.05rem;font-weight:700;}
  .meter-loc{color:var(--text-muted);font-size:.78rem;}
  .badge{
    display:inline-block;font-size:.68rem;font-weight:700;
    background:var(--warn);color:#2a0d0d;padding:2px 8px;border-radius:10px;margin-inline-start:6px;
  }

  .stat-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .stat{
    background:var(--surface-2);
    border-radius:10px;
    padding:8px 12px;
    flex:1;min-width:100px;text-align:center;
  }
  .stat .label{font-size:.68rem;color:var(--text-muted);}
  .stat .value{font-size:1.1rem;color:#FFFFFF;font-weight:700;}
  .stat .value.over{ color:var(--warn); }

  .chart-wrap{margin-top:14px;overflow-x:auto;}
  .chart-title{font-size:.75rem;color:var(--text-muted);margin-bottom:6px;}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.84rem;}
  th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--border);}
  th{color:var(--text-muted);font-weight:600;font-size:.76rem;}
  td.unit-up{color:var(--warn);font-weight:700;}
  td.unit-ok{color:var(--good);}
  .row-actions button{padding:3px 7px;font-size:.68rem;}

  .card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .card-actions button{flex:1;min-width:90px;}

  .empty{
    text-align:center;color:var(--text-muted);
    padding:40px 20px;border:1px dashed var(--border);border-radius:16px;
  }

  dialog{
    border:none;border-radius:16px;padding:0;
    background:var(--surface);color:var(--text);
    width:min(92vw,420px);
  }
  dialog::backdrop{background:rgba(0,0,0,.6);}
  .dialog-inner{padding:20px;}
  .dialog-inner h3{margin-bottom:14px;color:var(--accent);}
  label{display:block;font-size:.8rem;color:var(--text-muted);margin:10px 0 4px;}
  input{
    width:100%;padding:10px;border-radius:8px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    font-family:inherit;font-size:.95rem;
  }
  .dialog-actions{display:flex;gap:8px;margin-top:18px;}
  .dialog-actions button{flex:1;}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block !important;position:absolute;inset-inline-start:0;top:0;width:100%;
      color:#000;background:#fff;padding:20px;
    }
    #printArea table{width:100%;border-collapse:collapse;}
    #printArea th,#printArea td{border:1px solid #999;padding:6px;color:#000;}
    #printArea h1,#printArea h2{color:#000;font-family:serif;}
  }
  footer{text-align:center;color:var(--text-muted);font-size:.72rem;margin-top:30px;padding:0 20px;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="lang-switch">
      <button id="langUrBtn" onclick="setLang('ur')">اردو</button>
      <button id="langEnBtn" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <h1>⚡ <span data-i18n="title"></span></h1>
  <p data-i18n="subtitle"></p>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="btn-primary" onclick="openAddMeter()">➕ <span data-i18n="addMeterBtn"></span></button>
    <button class="btn-ghost" onclick="exportPDFAll()">📄 <span data-i18n="fullReportBtn"></span></button>
    <button class="btn-ghost" onclick="exportBackup()">💾 <span data-i18n="backupBtn"></span></button>
    <button class="btn-ghost" onclick="document.getElementById('restoreFile').click()">📂 <span data-i18n="restoreBtn"></span></button>
    <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="importBackup(event)">
    <button class="btn-ghost" onclick="openPinManage()">🔒 <span data-i18n="pinManageBtn"></span></button>
  </div>

  <div id="metersList"></div>
</div>

<footer data-i18n="footerNote"></footer>

<!-- Add Meter Dialog -->
<dialog id="meterDialog">
  <div class="dialog-inner">
    <input type="hidden" id="mEditId">
    <h3 id="meterDialogTitle" data-i18n="addMeterTitle"></h3>
    <label data-i18n="nameLabel"></label>
    <input type="text" id="mName">
    <label data-i18n="locLabel"></label>
    <input type="text" id="mLoc">
    <label data-i18n="rateLabel"></label>
    <input type="number" step="0.01" id="mRate">
    <label data-i18n="companyLabel"></label>
    <select id="mCompany" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:inherit;font-size:.95rem;">
    </select>
    <label data-i18n="refLabel"></label>
    <input type="text" id="mRefNo" maxlength="14" placeholder="e.g. 07123456789012">
    <div style="font-size:.72rem;color:var(--text-muted);margin-top:-4px" data-i18n="refHint"></div>
    <label data-i18n="thresholdLabel"></label>
    <input type="number" step="1" id="mThreshold" value="150">
    <label data-i18n="initReadingLabel"></label>
    <input type="number" step="0.01" id="mInitReading">
    <label data-i18n="initDateLabel"></label>
    <input type="date" id="mInitDate">
    <div class="dialog-actions">
      <button class="btn-ghost" onclick="closeDialog('meterDialog')" data-i18n="cancel"></button>
      <button class="btn-primary" id="meterSaveBtn" onclick="saveMeter()" data-i18n="save"></button>
    </div>
  </div>
</dialog>

<!-- Add Reading Dialog -->
<dialog id="readingDialog">
  <div class="dialog-inner">
    <h3 id="readingDialogTitle" data-i18n="addReadingTitle"></h3>
    <input type="hidden" id="rMeterId">
    <input type="hidden" id="rReadingId">
    <label data-i18n="currentReadingLabel"></label>
    <input type="number" step="0.01" id="rValue">
    <label data-i18n="dateLabel"></label>
    <input type="date" id="rDate">
    <label data-i18n="noteLabel"></label>
    <input type="text" id="rNote">
    <div class="dialog-actions">
      <button class="btn-ghost" onclick="closeDialog('readingDialog')" data-i18n="cancel"></button>
      <button class="btn-primary" id="readingSaveBtn" onclick="saveReading()" data-i18n="save"></button>
    </div>
  </div>
</dialog>

<!-- Bill Reference Number Dialog (works for any selected DISCO) -->
<dialog id="mepcoRefDialog">
  <div class="dialog-inner">
    <h3 data-i18n="mepcoDialogTitle"></h3>
    <p style="font-size:.82rem;color:var(--text-muted)" data-i18n="mepcoDialogHint"></p>
    <input type="text" readonly id="mepcoRefDisplay" onclick="this.select(); this.setSelectionRange(0,9999);"
      onfocus="this.select(); this.setSelectionRange(0,9999);"
      class="digits" style="font-size:1.6rem;font-weight:700;color:var(--accent);
      background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;
      padding:16px;text-align:center;margin:12px 0;letter-spacing:2px;width:100%;">
    <div style="font-size:.72rem;color:var(--text-muted);text-align:center;margin-top:-6px" data-i18n="tapToSelectHint"></div>
    <div id="mepcoCopyStatus" style="font-size:.78rem;color:var(--good);text-align:center;min-height:16px;"></div>
    <div class="dialog-actions">
      <button class="btn-ghost" onclick="manualCopyRef()" id="mepcoCopyBtn">📋 <span data-i18n="copyBtn"></span></button>
      <button class="btn-primary" onclick="openPortalAndClose()">🔗 <span id="openPortalLabel" data-i18n="openPortalBtn"></span></button>
    </div>
    <div class="dialog-actions">
      <button class="btn-ghost" onclick="closeDialog('mepcoRefDialog')" data-i18n="cancel"></button>
    </div>
  </div>
</dialog>

<!-- Security PIN Dialog: setup / change / verify-before-delete -->
<dialog id="pinDialog">
  <div class="dialog-inner">
    <h3 id="pinDialogTitle"></h3>
    <p id="pinDialogHint" style="font-size:.82rem;color:var(--text-muted)"></p>

    <div id="pinOldGroup" style="display:none">
      <label data-i18n="pinOldLabel"></label>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="pinOldInput">
    </div>
    <div id="pinVerifyGroup" style="display:none">
      <label data-i18n="pinEnterLabel"></label>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="pinVerifyInput">
    </div>
    <div id="pinNewGroup" style="display:none">
      <label data-i18n="pinNewLabel"></label>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="pinNewInput">
      <label data-i18n="pinConfirmLabel"></label>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="pinConfirmInput">
    </div>

    <div id="pinError" style="font-size:.78rem;color:var(--warn);text-align:center;min-height:16px;margin-top:8px;"></div>

    <div class="dialog-actions">
      <button class="btn-ghost" onclick="closeDialog('pinDialog')" data-i18n="cancel"></button>
      <button class="btn-primary" onclick="submitPinDialog()" data-i18n="save"></button>
    </div>
  </div>
</dialog>

<div id="printArea"></div>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n).toLocaleString('en-US', {maximumFractionDigits:2}); }

function sortedReadings(meter){ return [...meter.readings].sort((a,b)=> a.date.localeCompare(b.date)); }

function computeStats(meter){
  const r = sortedReadings(meter);
  if(r.length === 0) return {first:null, last:null, total:0, rows:[], avgDaily:0};
  const first = r[0];
  const last = r[r.length-1];
  let rows = [];
  for(let i=0;i<r.length;i++){
    const prev = i>0 ? r[i-1].value : r[0].value;
    const diff = i===0 ? 0 : (r[i].value - prev);
    rows.push({...r[i], diff, prevIndex:i>0});
  }
  const total = last.value - first.value;
  const days = Math.max(1, (new Date(last.date) - new Date(first.date)) / 86400000);
  const avgDaily = total / days;
  return {first, last, total, rows, avgDaily};
}

function buildChartSVG(stats, threshold){
  const bars = stats.rows.filter(r=>r.prevIndex);
  if(bars.length === 0) return '';
  const maxVal = Math.max(threshold, ...bars.map(b=>b.diff), 1);
  const barW = 34, gap = 14, leftPad = 36, topPad = 12, chartH = 120;
  const w = leftPad + bars.length*(barW+gap);
  const h = chartH + topPad + 34;
  const threshY = topPad + chartH - (threshold/maxVal)*chartH;

  let barsSvg = '';
  bars.forEach((b, i)=>{
    const x = leftPad + i*(barW+gap);
    const val = Math.max(b.diff, 0);
    const barH = (val/maxVal)*chartH;
    const y = topPad + chartH - barH;
    const color = b.diff >= threshold ? '#F87171' : (b.diff < 0 ? '#8B95A3' : '#FFB020');
    const shortDate = b.date.slice(5);
    barsSvg += `
      <rect x="${x}" y="${y}" width="${barW}" height="${Math.max(barH,2)}" rx="4" fill="${color}"/>
      <text x="${x+barW/2}" y="${topPad+chartH+16}" text-anchor="middle" font-size="10" fill="#8B95A3">${shortDate}</text>
      <text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="10" fill="#EDEFF2" class="digits">${fmt(b.diff)}</text>
    `;
  });

  return `<svg width="${w}" height="${h}" style="min-width:${w}px">
    <line x1="${leftPad-8}" y1="${threshY}" x2="${w}" y2="${threshY}" stroke="#F87171" stroke-dasharray="4,3" stroke-width="1.5"/>
    <text x="0" y="${threshY-4}" font-size="10" fill="#F87171">${t('threshLine')} ${fmt(threshold)}</text>
    ${barsSvg}
  </svg>`;
}

function renderMeterCard(meter){
  const stats = computeStats(meter);
  const total = stats.total;
  const rate = parseFloat(meter.rate) || 0;
  const threshold = parseFloat(meter.threshold) || 150;
  const estCost = rate>0 ? (total*rate) : null;
  const isOver = total >= threshold;

  let rowsHtml = '';
  stats.rows.forEach(row=>{
    const diffDisplay = row.prevIndex ? fmt(row.diff) : '—';
    let cls = '';
    if(row.prevIndex){ cls = row.diff >= threshold ? 'unit-up' : 'unit-ok'; }
    rowsHtml += `<tr>
      <td>${row.date}</td>
      <td class="digits">${fmt(row.value)}</td>
      <td class="digits ${cls}">${diffDisplay}</td>
      <td>${row.note||''}</td>
      <td class="row-actions">
        <button class="btn-ghost btn-sm" onclick="openEditReading('${meter.id}','${row.id}')">✏️</button>
        <button class="btn-danger btn-sm" onclick="deleteReading('${meter.id}','${row.id}')">🗑️</button>
      </td>
    </tr>`;
  });

  const ringPct = Math.min(1, total/threshold);
  const ringColor = isOver ? '#F87171' : '#FFB020';
  const circumference = 2*Math.PI*24;

  const chartSvg = buildChartSVG(stats, threshold);

  return `<div class="meter-card ${isOver ? 'alert' : ''}">
    <div class="meter-head">
      <div class="meter-title">
        <svg class="dial" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#2C3441" stroke-width="6"/>
          <circle cx="28" cy="28" r="24" fill="none" stroke="${ringColor}" stroke-width="6"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-ringPct)}"
            stroke-linecap="round" transform="rotate(-90 28 28)"/>
          <text x="28" y="32" text-anchor="middle" font-size="11" fill="#EDEFF2" font-family="Consolas,monospace">⚡</text>
        </svg>
        <div>
          <div class="meter-name">${meter.name}${isOver ? `<span class="badge">${t('highUsage')}</span>`:''}</div>
          <div class="meter-loc">${meter.loc || ''}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex:none;">
        <button class="btn-ghost btn-sm" onclick="openEditMeter('${meter.id}')">✏️ ${t('editMeterBtn')}</button>
        <button class="btn-danger btn-sm" onclick="deleteMeter('${meter.id}')">${t('deleteMeterBtn')}</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="label">${t('firstReading')}</div><div class="value digits">${stats.first?fmt(stats.first.value):'—'}</div></div>
      <div class="stat"><div class="label">${t('lastReading')}</div><div class="value digits">${stats.last?fmt(stats.last.value):'—'}</div></div>
      <div class="stat"><div class="label">${t('totalUnits')}</div><div class="value digits ${isOver?'over':''}">${fmt(total)}</div></div>
      <div class="stat"><div class="label">${t('avgDaily')}</div><div class="value digits">${fmt(stats.avgDaily)}</div></div>
      ${estCost!==null ? `<div class="stat"><div class="label">${t('estBill')}</div><div class="value digits">${fmt(estCost)}</div></div>` : ''}
    </div>

    ${chartSvg ? `<div class="chart-wrap"><div class="chart-title">${t('dailyUsageChart')}</div>${chartSvg}</div>` : ''}

    <table>
      <thead><tr><th>${t('tableDate')}</th><th>${t('tableReading')}</th><th>${t('tableUnits')}</th><th>${t('tableNote')}</th><th></th></tr></thead>
      <tbody>${rowsHtml || `<tr><td colspan="5" style="color:var(--text-muted)">${t('noReadings')}</td></tr>`}</tbody>
    </table>

    <div class="card-actions">
      <button class="btn-primary btn-sm" onclick="openAddReading('${meter.id}')">➕ ${t('addReadingBtn')}</button>
      <button class="btn-ghost btn-sm" onclick="exportPDFOne('${meter.id}')">📄 ${t('meterReportBtn')}</button>
      <button class="btn-ghost btn-sm" onclick="openMepcoBill('${meter.id}')">🧾 ${t('mepcoBillBtn')}</button>
    </div>
  </div>`;
}

  const el = document.getElementById('metersList');

    el.innerHTML = `<div class="empty">${t('noMeters')}</div>`;

function openEditMeter(meterId){
  const meter = meters.find(m=>m.id===meterId);
  if(!meter) return;
  document.getElementById('mEditId').value = meter.id;
  document.getElementById('meterDialogTitle').textContent = t('editMeterTitle');

  document.getElementById('mLoc').value = meter.loc || '';

  // Editing an existing meter edits its details; the "initial reading" fields
  // here let the user correct the very first reading on record (if any).
  const first = sortedReadings(meter)[0];
  if(first){
    document.getElementById('mInitReading').value = first.value;
    document.getElementById('mInitDate').value = first.date;
  } else {

  }

function closeDialog(id){ document.getElementById(id).close(); }

function saveMeter(){
  const name = document.getElementById('mName').value.trim();
  if(!name){ alert(t('alertName')); return; }
  const loc = document.getElementById('mLoc').value.trim();
  const rate = document.getElementById('mRate').value;
  const company = document.getElementById('mCompany').value;
  const refNo = document.getElementById('mRefNo').value.trim();
  const threshold = document.getElementById('mThreshold').value || 150;
  const initReading = parseFloat(document.getElementById('mInitReading').value);
  const initDate = document.getElementById('mInitDate').value || todayStr();
  const editId = document.getElementById('mEditId').value;

  if(editId){
    const meter = meters.find(m=>m.id===editId);
    meter.name = name;
    meter.loc = loc;
    meter.rate = rate;
    meter.company = company;
    meter.refNo = refNo;
    meter.threshold = threshold;
    // Update (or create) the first/initial reading if a value was given
    if(!isNaN(initReading)){
      const sorted = sortedReadings(meter);
      if(sorted.length > 0){
        const firstReading = meter.readings.find(r=>r.id === sorted[0].id);
        firstReading.value = initReading;
        firstReading.date = initDate;
      } else {
        meter.readings.push({id:uid(), date:initDate, value:initReading, note: currentLang==='ur' ? 'ابتدائی ریڈنگ' : 'Initial reading'});
      }
    }
  } else {
    const meter = { id: uid(), name, loc, rate, company, refNo, threshold, readings: [] };
    if(!isNaN(initReading)){
      meter.readings.push({id:uid(), date:initDate, value:initReading, note: currentLang==='ur' ? 'ابتدائی ریڈنگ' : 'Initial reading'});
    }
    meters.push(meter);
  }
  saveData();
  renderAll();
  closeDialog('meterDialog');
}

const PIN_KEY = 'emt_pin';
let pinDialogMode = null; // 'setup' | 'verify' | 'change'
let pinPendingMeterId = null;

function getPin(){ return localStorage.getItem(PIN_KEY) || ''; }
function setPin(pin){ localStorage.setItem(PIN_KEY, pin); }

function deleteMeter(id){
  if(!confirm(t('confirmDeleteMeter'))) return;
  pinPendingMeterId = id;
  if(!getPin()){
    openPinDialog('setup');
  } else {
    openPinDialog('verify');
  }
}

function actuallyDeleteMeter(id){
  meters = meters.filter(m=>m.id!==id);
  saveData();
  renderAll();
}

function openPinManage(){
  pinPendingMeterId = null;
  openPinDialog('change');
}

function openPinDialog(mode){
  pinDialogMode = mode;
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinOldInput').value = '';
  document.getElementById('pinVerifyInput').value = '';
  document.getElementById('pinNewInput').value = '';
  document.getElementById('pinConfirmInput').value = '';

  const hasPin = !!getPin();
  document.getElementById('pinOldGroup').style.display = (mode === 'change' && hasPin) ? 'block' : 'none';
  document.getElementById('pinVerifyGroup').style.display = (mode === 'verify') ? 'block' : 'none';
  document.getElementById('pinNewGroup').style.display = (mode === 'setup' || mode === 'change') ? 'block' : 'none';

  if(mode === 'setup'){
    document.getElementById('pinDialogTitle').textContent = t('pinSetupTitle');
    document.getElementById('pinDialogHint').textContent = t('pinSetupHint');
  } else if(mode === 'verify'){
    document.getElementById('pinDialogTitle').textContent = t('pinVerifyTitle');
    document.getElementById('pinDialogHint').textContent = t('pinVerifyHint');
  } else {
    document.getElementById('pinDialogTitle').textContent = t('pinChangeTitle');
    document.getElementById('pinDialogHint').textContent = t('pinChangeHint');
  }
  document.getElementById('pinDialog').showModal();
}

function submitPinDialog(){
  const errEl = document.getElementById('pinError');
  errEl.textContent = '';

  if(pinDialogMode === 'verify'){
    const entered = document.getElementById('pinVerifyInput').value.trim();
    if(entered !== getPin()){
      errEl.textContent = t('pinWrong');
      return;
    }
    closeDialog('pinDialog');
    if(pinPendingMeterId){ actuallyDeleteMeter(pinPendingMeterId); pinPendingMeterId = null; }
    return;
  }

  // 'setup' or 'change' mode: validate and save a new PIN
  if(pinDialogMode === 'change' && getPin()){
    const oldEntered = document.getElementById('pinOldInput').value.trim();
    if(oldEntered !== getPin()){
      errEl.textContent = t('pinWrongOld');
      return;
    }
  }
  const newPin = document.getElementById('pinNewInput').value.trim();
  const confirmPin = document.getElementById('pinConfirmInput').value.trim();
  if(newPin.length < 4){
    errEl.textContent = t('pinTooShort');
    return;
  }
  if(newPin !== confirmPin){
    errEl.textContent = t('pinMismatch');
    return;
  }
  setPin(newPin);
  closeDialog('pinDialog');

  if(pinDialogMode === 'setup' && pinPendingMeterId){
    actuallyDeleteMeter(pinPendingMeterId);
    pinPendingMeterId = null;
  } else {
    alert(t('pinSetSuccess'));
  }
}

// ---- Threshold notifications ----
function requestNotifyPermission(){
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function checkThresholdNotify(meter){
  const stats = computeStats(meter);
  const threshold = parseFloat(meter.threshold) || 150;
  const latestRow = stats.rows[stats.rows.length - 1];
  if(!latestRow || !latestRow.prevIndex) return;
  if(latestRow.diff >= threshold){
    const title = currentLang === 'ur' ? '⚡ زیادہ یونٹ استعمال' : '⚡ High Unit Usage';
    const body = currentLang === 'ur'
      ? `${meter.name}: ${fmt(latestRow.diff)} یونٹ استعمال ہوئے (حد: ${fmt(threshold)})`
      : `${meter.name}: ${fmt(latestRow.diff)} units used (threshold: ${fmt(threshold)})`;
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification(title, {body, icon:'icon-192.png'}); }
      catch(e){ alert(title + '\n' + body); }
    } else {
      alert(title + '\n' + body);
    }
  }
}

function deleteReading(meterId, readingId){
  const meter = meters.find(m=>m.id===meterId);
  meter.readings = meter.readings.filter(r=>r.id!==readingId);
  saveData();
  renderAll();
}

function buildPrintHtml(meterList){
  const now = new Date().toLocaleString('en-GB');
  let html = `<h1 style="text-align:center">⚡ ${t('printTitle')}</h1>
    <p style="text-align:center;color:#555">${t('printGenerated')}: ${now}</p>`;
  meterList.forEach(meter=>{
    const stats = computeStats(meter);
    const rate = parseFloat(meter.rate) || 0;
    const threshold = parseFloat(meter.threshold) || 150;
    const estCost = rate>0 ? (stats.total*rate) : null;
    html += `<h2>${meter.name} ${meter.loc? '— '+meter.loc:''}</h2>
      ${meter.refNo ? `<p style="color:#555">${(DISCO_LIST.find(d=>d.code===meter.company)||{}).name || 'DISCO'} Ref#: ${meter.refNo}</p>` : ''}
      <p>${t('firstReading')}: ${stats.first?fmt(stats.first.value):'—'} &nbsp;|&nbsp;
         ${t('lastReading')}: ${stats.last?fmt(stats.last.value):'—'} &nbsp;|&nbsp;
         ${t('totalUnits')}: <b style="${stats.total>=threshold?'color:#c0392b':''}">${fmt(stats.total)}</b> &nbsp;|&nbsp;
         ${t('avgDaily')}: ${fmt(stats.avgDaily)}
         ${estCost!==null? ' &nbsp;|&nbsp; '+t('estBill')+': <b>Rs '+fmt(estCost)+'</b>' : ''}
      </p>
      <table><thead><tr><th>${t('tableDate')}</th><th>${t('tableReading')}</th><th>${t('tableUnits')}</th><th>${t('tableNote')}</th></tr></thead><tbody>`;
    stats.rows.forEach(row=>{
      html += `<tr><td>${row.date}</td><td>${fmt(row.value)}</td><td>${row.prevIndex? fmt(row.diff):'—'}</td><td>${row.note||''}</td></tr>`;
    });
    html += `</tbody></table><br>`;
  });
  return html;
}

function doPrint(html){
  document.getElementById('printArea').innerHTML = html;
  window.print();
}
function exportPDFOne(meterId){
  const meter = meters.find(m=>m.id===meterId);

function exportPDFAll(){
  if(meters.length===0){ alert(t('alertNoMeters')); return; }

}

  { code:'ke',     name:'K-Electric (Karachi)',  url:'https://www.ke.com.pk/customer-services/bills-and-e-payments' }
];

function populateCompanyDropdown(){
  const sel = document.getElementById('mCompany');
  if(!sel || sel.options.length > 0) return;
  const blank = document.createElement('option');
  blank.value = '';
  blank.textContent = t('companyPlaceholder');
  sel.appendChild(blank);
  DISCO_LIST.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d.code;
    opt.textContent = d.name;
    sel.appendChild(opt);
  });
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>{ legacyCopy(text); });
  } else {
    legacyCopy(text);
  }
}
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function openMepcoBill(meterId){
  const meter = meters.find(m=>m.id===meterId);
  const refNo = (meter && meter.refNo) ? meter.refNo.trim() : '';
  const disco = meter ? DISCO_LIST.find(d=>d.code === meter.company) : null;
  if(!refNo || !disco){
    alert(t('noRefSet'));
    openEditMeter(meterId);
    return;
  }
  copyToClipboard(refNo);
  const refInput = document.getElementById('mepcoRefDisplay');
  refInput.value = refNo;
  document.getElementById('mepcoCopyStatus').textContent = '';
  document.getElementById('mepcoCopyBtn').querySelector('span').textContent = t('copyBtn');
  document.getElementById('mepcoRefDialog').setAttribute('data-ref', refNo);
  document.getElementById('mepcoRefDialog').setAttribute('data-url', disco.url);
  document.getElementById('openPortalLabel').textContent = t('openPortalBtn') + ' — ' + disco.name;
  document.getElementById('mepcoRefDialog').showModal();
  refInput.select();
  refInput.setSelectionRange(0, 9999);
}

function manualCopyRef(){
  const input = document.getElementById('mepcoRefDisplay');
  const refNo = input.value;
  if(!refNo) return;
  input.focus();
  input.select();
  input.setSelectionRange(0, 9999);

  let execSuccess = false;
  try{ execSuccess = document.execCommand('copy'); }catch(e){ execSuccess = false; }

  const btnSpan = document.getElementById('mepcoCopyBtn').querySelector('span');
  const original = btnSpan.textContent;

  if(execSuccess){
    showCopySuccess(btnSpan, original);
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(refNo)
      .then(()=>showCopySuccess(btnSpan, original))
      .catch(()=>showCopyManualHint());
  } else {
    showCopyManualHint();
  }
}

function showCopySuccess(btnSpan, original){
  document.getElementById('mepcoCopyStatus').textContent = t('copiedStatus');
  document.getElementById('mepcoCopyStatus').style.color = 'var(--good)';
  btnSpan.textContent = t('copiedStatus');
  setTimeout(()=>{ btnSpan.textContent = original; }, 1500);
}

function showCopyManualHint(){
  document.getElementById('mepcoCopyStatus').textContent = t('copyManualHint');
  document.getElementById('mepcoCopyStatus').style.color = 'var(--warn)';
}

function openPortalAndClose(){
  const url = document.getElementById('mepcoRefDialog').getAttribute('data-url') || 'https://bill.pitc.com.pk/';
  window.open(url, '_blank');
  closeDialog('mepcoRefDialog');
}

// ---- Backup / restore ----
function exportBackup(){
  const blob = new Blob([JSON.stringify(meters, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `bijli-meter-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('invalid');
      if(meters.length>0 && !confirm(t('restoreConfirmMsg'))) return;
      meters = data;
      saveData();
      renderAll();
      alert(t('restoreSuccess'));
    }catch(err){
      alert(t('restoreInvalid'));
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ---- init ----
loadData();
applyLang();
populateCompanyDropdown();
renderAll();
requestNotifyPermission();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
